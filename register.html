<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Spider Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extras.css">
</head>
<body>
    <main class="page-container">
        <div class="card">
            <header class="card-header">
                <h1 class="brand-title">Spider Web</h1>
                <p class="subtitle">Create an account and get your powers.</p>
            </header>

            <div id="formAlert" class="form-alert d-none" role="alert" aria-live="polite"></div>

            <form id="registerForm" action="#" method="POST" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name" autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email" autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input
                        type="password"
                        id="reg-password"
                        name="password"
                        placeholder="Create a password" autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password" autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">Get Powers!</button>
            </form>

            <footer class="card-footer">
                <p>Already a hero? <a href="login.html">Login</a></p>
            </footer>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
